name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g. 1.2.3)'
        required: true
      release_description:
        description: 'Extra description (optional)'
        required: false

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build APK
        run: |
          echo "${{ secrets.KEY_BASE64 }}" | base64 --decode - > app/release.jks
          ./gradlew clean assembleRelease --no-build-cache --no-configuration-cache \
            -PstoreFile="$(pwd)/app/release.jks" \
            -PstorePassword="${{ secrets.KEYSTORE_PASSWORD }}" \
            -PkeyPassword="${{ secrets.KEY_PASSWORD }}" \
            -PkeyAlias="${{ secrets.KEY_ALIAS }}"
          mv app/build/outputs/apk/release/app-release.apk MDPC-${{ github.sha }}.apk

      - name: Create Git tag
        run: |
          VERSION="v${{ github.event.inputs.release_version }}"
          git config user.name ${{ secrets.GIT_USERNAME }}
          git config user.email ${{ secrets.GIT_EMAIL }}
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Generate release notes
        id: notes
        uses: actions/github-script@v7
        with:
          script: |
            const { data: latest } = await github.rest.repos.listTags({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 2
            });

            let prevTag = latest.length > 1 ? latest[1].name : null;
            let notes = "";
            if (prevTag) {
              const { data } = await github.rest.repos.generateReleaseNotes({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: "v" + context.payload.inputs.release_version,
                previous_tag_name: prevTag
              });
              notes = data.body;
            } else {
              notes = "Initial release.";
            }

            const desc = context.payload.inputs.release_description || "";
            core.setOutput("body", notes + (desc ? "\n\n" + desc : ""));

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.event.inputs.release_version }}" \
            -t "v${{ github.event.inputs.release_version }}" \
            -F <(echo "${{ steps.notes.outputs.body }}") \
            *.apk

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v4
